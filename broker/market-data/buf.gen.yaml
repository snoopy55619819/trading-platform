# Only the exchange's vendored spec is generated now.
#
# Only the exchange's published market data schema. There are no broker-internal protos:
# types that never cross a wire are plain TypeScript inside whichever service owns them.
# This service vendors its own copy of the spec, so a rewrite in Go or Rust would generate
# from the same file with a different plugin and change nothing else.
#
# js + dts rather than ts: protoc-gen-es renders proto enums as TypeScript `enum`, which
# Node's type stripping cannot erase, and Node 26 has no --experimental-transform-types.
version: v2
clean: true
inputs:
  - directory: vendor/exchange-alpha
plugins:
  - local: ./node_modules/.bin/protoc-gen-es
    out: gen
    opt: [target=js, import_extension=js]
  - local: ./node_modules/.bin/protoc-gen-es
    out: gen
    opt: [target=dts, import_extension=js]
