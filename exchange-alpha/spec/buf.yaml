version: v2
lint:
  use:
    - STANDARD
  except:
    # PACKAGE_DIRECTORY_MATCH requires a proto's directory to mirror its package name
    # (broker/v1/order.proto for package broker.v1). At this size that is pure nesting
    # for no benefit - these files sit flat next to each other and are easier to find.
    # Everything else in STANDARD stays, including the enum prefix and zero-value rules,
    # which BASIC does NOT include.
    - PACKAGE_DIRECTORY_MATCH
breaking:
  use:
    - FILE
