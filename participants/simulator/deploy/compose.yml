# The simulated trading firms in production. Another company: it only joins the shared
# `trading` network and reaches the exchange as any client does, at gateway:9878 and
# gateway:9879, and the newswire at newswire:9890. Nothing is published to the host.
#
#   docker compose -f participants/simulator/deploy/compose.yml up -d --build
name: simulator-deploy

services:
  simulator:
    build: ..
    image: ${IMAGE_PREFIX:-local}/simulator:${TAG:-latest}
    environment:
      SIM_FIX_HOST: gateway
      SIM_FIX_PORT: "9878"
      SIM_FEED_URL: ws://gateway:9879
      # Prices gap only on news (ADR 0006). Without the newswire they still move, without gaps.
      SIM_NEWS_URL: ws://newswire:9890/headlines
      # Twice as busy as local development. Ran at 0.2 until the gateway stopped keeping a
      # full record of every finished order (ADR 0005), then at 1. Measured at 1 on 13 Nov
      # 2026, the server was nowhere near its limits (docs/DEPLOYMENT.md). This setting only
      # scales the traders who take prices, so the cap on orders a second goes up with it:
      # at 40 the opening rush would flatten against it. Set either to override.
      SIM_ACTIVITY: ${SIM_ACTIVITY:-2}
      SIM_MAX_ORDERS_PER_SEC: ${SIM_MAX_ORDERS_PER_SEC:-80}
    volumes:
      - state:/data
    networks: [trading]
    restart: unless-stopped

volumes:
  state:

networks:
  trading:
    external: true
