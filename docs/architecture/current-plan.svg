<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 750" width="1440" height="750">
<style>
  :root {
    --bg: #f6f6f4; --surface: #ffffff; --ink: #1d1d1f; --ink-2: #5d6168; --line: #c8cbd0;
    --node: #ffffff; --node-stroke: #3b3f45; --module: #eef0f3;
    --flow-1: #1f63c4; --flow-2: #b55300; --flow-3: #2c7a4b;
    --own-1: #edf2fa; --own-1-stroke: #9db3d6;
    --own-2: #faf2e9; --own-2-stroke: #d7b48d;
    --own-3: #f0f0f0; --own-3-stroke: #b5b5b5;
    --ok: #2c7a4b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111214; --surface: #1a1c20; --ink: #e9e9eb; --ink-2: #a2a6ad; --line: #3a3e45;
      --node: #23262b; --node-stroke: #b9bdc4; --module: #2e3238;
      --flow-1: #6ea8ff; --flow-2: #ffa657; --flow-3: #6fd09a;
      --own-1: #172235; --own-1-stroke: #3e5a86;
      --own-2: #2b2015; --own-2-stroke: #7a5a36;
      --own-3: #222326; --own-3-stroke: #4c4f55;
      --ok: #6fd09a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111214; --surface: #1a1c20; --ink: #e9e9eb; --ink-2: #a2a6ad; --line: #3a3e45;
    --node: #23262b; --node-stroke: #b9bdc4; --module: #2e3238;
    --flow-1: #6ea8ff; --flow-2: #ffa657; --flow-3: #6fd09a;
    --own-1: #172235; --own-1-stroke: #3e5a86;
    --own-2: #2b2015; --own-2-stroke: #7a5a36;
    --own-3: #222326; --own-3-stroke: #4c4f55;
    --ok: #6fd09a;
  }

  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1320px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: start; gap: 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 32px 0 8px; }
  .sub { color: var(--ink-2); margin: 0; max-width: 72ch; }
  #theme { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; flex: none; }
  .diagram { margin-top: 20px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px; overflow-x: auto; }
  .diagram svg { display: block; width: 100%; min-width: 1100px; height: auto; }

  svg text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
  .boundary rect { stroke-width: 1.5; }
  .own-1 rect { fill: var(--own-1); stroke: var(--own-1-stroke); }
  .own-2 rect { fill: var(--own-2); stroke: var(--own-2-stroke); }
  .own-3 rect { fill: var(--own-3); stroke: var(--own-3-stroke); }
  .boundary text { font-size: 12px; font-weight: 700; letter-spacing: .06em; fill: var(--ink-2); }
  .divider { stroke: var(--line); stroke-width: 1; }
  .band { font-size: 15px; font-weight: 700; letter-spacing: .08em; }

  .node rect, .node path { fill: var(--node); stroke: var(--node-stroke); stroke-width: 1.5; }
  .module rect { fill: var(--module); stroke: var(--node-stroke); stroke-width: 1; }
  .n-title { font-size: 14px; font-weight: 600; }
  .n-sub { font-size: 12px; fill: var(--ink-2); }
  .tag { font-size: 11px; font-weight: 700; letter-spacing: .06em; fill: var(--ink-2); }
  .tag.built { fill: var(--ok); }

  .edge { fill: none; stroke-width: 2; }
  .edge.flow-1 { stroke: var(--flow-1); }
  .edge.flow-2 { stroke: var(--flow-2); }
  .edge.thin { stroke-width: 1.5; }
  .links { fill: none; stroke: var(--ink-2); stroke-width: 1.25; }
  .elabel { font-size: 12px; paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
  .t-flow-1 { fill: var(--flow-1); } .t-flow-2 { fill: var(--flow-2); } .t-muted { fill: var(--ink-2); }
  .arrow-1 { fill: var(--flow-1); } .arrow-2 { fill: var(--flow-2); }
  .badge circle { fill: var(--ink); }
  .badge text { fill: var(--surface); font-size: 11px; font-weight: 700; }

  .key { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 0; padding: 0; list-style: none; }
  .key li { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
  .key svg { width: 44px; height: 26px; flex: none; overflow: visible; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; color: var(--ink-2); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  td.n { width: 3em; }
  td.n span { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
    background: var(--ink); color: var(--surface); font-size: 11px; font-weight: 700; }
  code { font-size: .92em; }
  .notes { color: var(--ink-2); font-size: 14px; }

  .export-bg { fill: var(--surface); }
</style>
<defs>
    <marker id="arr-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="arrow-1" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arr-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="arrow-2" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
<rect class="export-bg" x="0" y="0" width="1440" height="750" rx="10"/>
<title id="dtitle">Current MVP plan: a broker backend and an exchange binary, connected over FIX for orders and WebSocket for market data</title>

  <!-- Owner boundaries -->
  <g class="boundary own-1"><rect x="40" y="30" width="505" height="690" rx="12"/><text x="56" y="52">BROKER</text></g>
  <g class="boundary own-2"><rect x="700" y="30" width="540" height="690" rx="12"/><text x="716" y="52">ALPHA EXCHANGE</text></g>
  <g class="boundary own-3"><rect x="1260" y="30" width="170" height="690" rx="12"/><text x="1276" y="52">THIRD PARTIES</text><text x="1276" y="68">(SIMULATED)</text></g>

  <!-- Planes -->
  <line class="divider" x1="30" y1="470" x2="1420" y2="470"/>
  <text class="band t-flow-1" transform="translate(22 250) rotate(-90)" text-anchor="middle">ORDER PLANE · PRIVATE</text>
  <text class="band t-flow-2" transform="translate(22 595) rotate(-90)" text-anchor="middle">MARKET DATA PLANE · PUBLIC</text>

  <!-- Process shells (drawn before edges and modules) -->
  <g class="node"><rect x="95" y="180" width="420" height="172" rx="10"/>
    <text class="n-title" x="181" y="202">backend</text>
    <text class="n-sub" x="181" y="219">one process · one transaction</text></g>
  <g class="node"><rect x="740" y="180" width="320" height="450" rx="10"/>
    <text class="n-title" x="754" y="202">exchange-alpha</text>
    <text class="n-sub" x="754" y="219">one Rust binary</text></g>

  <!-- Edges: order plane -->
  <path class="edge flow-1" d="M165,140 L165,230" marker-end="url(#arr-1)"/>
  <text class="elabel t-flow-1" x="173" y="160">HTTP</text>
  <text class="elabel t-flow-1" x="173" y="174">orders · positions</text>

  <path class="edge flow-1 thin" d="M215,254 L253,254" marker-end="url(#arr-1)"/>
  <path class="edge flow-1 thin" d="M355,254 L393,254" marker-end="url(#arr-1)"/>
  <path class="edge flow-1 thin" d="M305,277 L305,296" marker-end="url(#arr-1)"/>

  <path class="edge flow-1" d="M305,352 L305,384" marker-end="url(#arr-1)"/>

  <path class="edge flow-1" d="M495,246 L758,246" marker-end="url(#arr-1)"/>

  <path class="edge flow-1" d="M760,266 L497,266" marker-end="url(#arr-1)"/>

  <g class="badge" transform="translate(622 186)"><circle r="11"/><text y="4" text-anchor="middle">4</text></g>
  <text class="elabel t-flow-1" x="622" y="216" text-anchor="middle">FIX 4.4 / TCP</text>
  <text class="elabel t-flow-1" x="622" y="232" text-anchor="middle">NewOrderSingle 35=D</text>
  <text class="elabel t-flow-1" x="622" y="286" text-anchor="middle">ExecutionReport 35=8</text>
  <g class="badge" transform="translate(622 310)"><circle r="11"/><text y="4" text-anchor="middle">10</text></g>

  <path class="links" d="M900,144 L900,230"/>

  <path class="edge flow-1" d="M1040,268 L1152,268 L1152,320" marker-end="url(#arr-1)"/>

  <path class="edge flow-1" d="M860,277 L860,418" marker-end="url(#arr-1)"/>
  <text class="elabel t-flow-1" x="852" y="347" text-anchor="end">NewOrder · Cancel</text>
  <path class="edge flow-1" d="M940,420 L940,279" marker-end="url(#arr-1)"/>
  <text class="elabel t-flow-1" x="948" y="347">Fill</text>

  <path class="edge flow-1" d="M1040,478 L1094,478" marker-end="url(#arr-1)"/>
  <text class="elabel t-flow-1" x="1067" y="469" text-anchor="middle">write</text>

  <path class="edge flow-1" d="M1345,554 L1345,250 L1042,250" marker-end="url(#arr-1)"/>
  <text class="elabel t-flow-1" x="1135" y="226" text-anchor="middle">FIX 4.4 / TCP</text>
  <text class="elabel t-flow-1" x="1135" y="240" text-anchor="middle">NewOrderSingle</text>

  <!-- Edges: market data plane -->
  <path class="edge flow-2" d="M900,520 L900,558" marker-end="url(#arr-2)"/>
  <text class="elabel t-flow-2" x="892" y="543" text-anchor="end">BookDelta · Trade</text>

  <path class="edge flow-2" d="M760,582 L385,582" marker-end="url(#arr-2)"/>
  <text class="elabel t-flow-2" x="622" y="558" text-anchor="middle">WebSocket</text>
  <text class="elabel t-flow-2" x="622" y="572" text-anchor="middle">Snapshot · Delta</text>

  <path class="edge flow-2" d="M1040,582 L1273,582" marker-end="url(#arr-2)"/>
  <text class="elabel t-flow-2" x="1135" y="558" text-anchor="middle">WebSocket</text>
  <text class="elabel t-flow-2" x="1135" y="572" text-anchor="middle">Snapshot · Delta</text>

  <path class="edge flow-2" d="M293,610 L293,630" marker-end="url(#arr-2)"/>

  <path class="edge flow-2" d="M203,582 L70,582 L70,114 L103,114" marker-end="url(#arr-2)"/>
  <text class="elabel t-flow-2" x="78" y="396">WebSocket · REST</text>
  <text class="elabel t-flow-2" x="78" y="410">prices · history</text>

  <!-- Nodes -->
  <g class="node"><rect x="105" y="88" width="120" height="52" rx="8"/>
    <text class="n-title" x="165" y="110" text-anchor="middle">web</text>
    <text class="n-sub" x="165" y="128" text-anchor="middle">static SPA</text></g>

  <g class="module"><rect x="115" y="232" width="100" height="45" rx="6"/>
    <text class="n-title" x="165" y="252" text-anchor="middle">api</text>
    <text class="n-sub" x="165" y="268" text-anchor="middle">front door</text></g>
  <g class="module"><rect x="255" y="232" width="100" height="45" rx="6"/>
    <text class="n-title" x="305" y="252" text-anchor="middle">oms</text>
    <text class="n-sub" x="305" y="268" text-anchor="middle">risk · lifecycle</text></g>
  <g class="module"><rect x="395" y="232" width="100" height="45" rx="6"/>
    <text class="n-title" x="445" y="252" text-anchor="middle">fix</text>
    <text class="n-sub" x="445" y="268" text-anchor="middle">initiator</text></g>
  <g class="module"><rect x="255" y="298" width="100" height="42" rx="6"/>
    <text class="n-title" x="305" y="316" text-anchor="middle">ledger</text>
    <text class="n-sub" x="305" y="332" text-anchor="middle">double-entry</text></g>

  <g class="node"><path d="M259,394 a46,8 0 0,0 92,0 a46,8 0 0,0 -92,0 v46 a46,8 0 0,0 92,0 v-46"/>
    <text class="n-title" x="305" y="426" text-anchor="middle">broker-db</text>
    <text class="n-sub" x="305" y="441" text-anchor="middle">Postgres</text></g>

  <g class="node lib"><rect x="840" y="82" width="130" height="56" rx="6"/><rect x="835" y="88" width="130" height="56" rx="6"/>
    <text class="tag" x="845" y="104">LIB</text>
    <text class="n-title" x="900" y="126" text-anchor="middle">fix-core</text></g>

  <g class="module"><rect x="760" y="232" width="280" height="45" rx="6"/>
    <text class="n-title" x="900" y="252" text-anchor="middle">gateway</text>
    <text class="n-sub" x="900" y="268" text-anchor="middle">validation</text></g>
  <g class="module"><rect x="760" y="420" width="280" height="100" rx="6"/>
    <text class="n-title" x="900" y="466" text-anchor="middle">matching-engine</text>
    <text class="n-sub" x="900" y="484" text-anchor="middle">in memory</text></g>
  <g class="module"><rect x="760" y="560" width="280" height="45" rx="6"/>
    <text class="n-title" x="900" y="579" text-anchor="middle">md-publisher</text>
    <text class="n-sub" x="900" y="596" text-anchor="middle">sequenced</text></g>

  <g class="node"><path d="M1096,330 a56,8 0 0,0 112,0 a56,8 0 0,0 -112,0 v46 a56,8 0 0,0 112,0 v-46"/>
    <text class="n-title" x="1152" y="362" text-anchor="middle">exchange-db</text>
    <text class="n-sub" x="1152" y="377" text-anchor="middle">Postgres</text></g>
  <g class="node"><path d="M1096,456 a56,8 0 0,0 112,0 a56,8 0 0,0 -112,0 v46 a56,8 0 0,0 112,0 v-46"/>
    <text class="n-title" x="1152" y="488" text-anchor="middle">journal</text>
    <text class="n-sub" x="1152" y="503" text-anchor="middle">append-only</text></g>

  <g class="node"><rect x="203" y="554" width="180" height="56" rx="8"/>
    <text class="n-title" x="293" y="576" text-anchor="middle">market-data</text>
    <text class="n-sub" x="293" y="594" text-anchor="middle">live + history</text></g>
  <g class="node"><path d="M247,640 a46,8 0 0,0 92,0 a46,8 0 0,0 -92,0 v46 a46,8 0 0,0 92,0 v-46"/>
    <text class="n-title" x="293" y="672" text-anchor="middle">md-db</text>
    <text class="n-sub" x="293" y="687" text-anchor="middle">Postgres</text></g>

  <g class="node"><rect x="1275" y="554" width="140" height="56" rx="8"/>
    <text class="n-title" x="1345" y="576" text-anchor="middle">simulator</text>
    <text class="n-sub" x="1345" y="594" text-anchor="middle">agents</text></g>

  <!-- Badges -->
  <g class="badge" transform="translate(225 88)"><circle r="11"/><text y="4" text-anchor="middle">1</text></g>
  <g class="badge" transform="translate(515 180)"><circle r="11"/><text y="4" text-anchor="middle">2</text></g>
  <g class="badge" transform="translate(351 390)"><circle r="11"/><text y="4" text-anchor="middle">3</text></g>
  <g class="badge" transform="translate(1040 232)"><circle r="11"/><text y="4" text-anchor="middle">5</text></g>
  <g class="badge" transform="translate(1208 326)"><circle r="11"/><text y="4" text-anchor="middle">6</text></g>
  <g class="badge" transform="translate(965 88)"><circle r="11"/><text y="4" text-anchor="middle">7</text></g>
  <g class="badge" transform="translate(1040 420)"><circle r="11"/><text y="4" text-anchor="middle">8</text></g>
  <g class="badge" transform="translate(1208 452)"><circle r="11"/><text y="4" text-anchor="middle">9</text></g>
  <g class="badge" transform="translate(1040 560)"><circle r="11"/><text y="4" text-anchor="middle">11</text></g>
  <g class="badge" transform="translate(622 536)"><circle r="11"/><text y="4" text-anchor="middle">12</text></g>
  <g class="badge" transform="translate(383 554)"><circle r="11"/><text y="4" text-anchor="middle">13</text></g>
  <g class="badge" transform="translate(1415 554)"><circle r="11"/><text y="4" text-anchor="middle">14</text></g>
</svg>
