syntax = "proto3";

package tp.marketdata.v1;

import "tp/common/v1/common.proto";

// The PUBLIC plane. Broadcast, sequenced, anonymous, fanned out to every subscriber.
// Nothing here identifies an account or a client_order_id - see contracts/DECISIONS.md §7.
//
// Every message carries feed_seq: monotonic per venue, starts at 1, never resets while the
// venue is up, never skips. A subscriber that observes a gap has LOST DATA and must recover
// via Snapshot; it must not silently continue.

message PriceLevel {
  int64 price_cents = 1;
  int64 qty = 2;
  // How many resting orders make up this level. Exposed because depth-of-book
  // displays show it; the individual orders are never published.
  int32 order_count = 3;
}

// Full state of one symbol's book. Sent on subscribe, and on demand after a gap.
message Snapshot {
  string venue = 1;
  string symbol = 2;
  uint64 feed_seq = 3;
  int64 ts_ns = 4;
  // Bids descending by price, asks ascending. Both truncated to depth_limit levels.
  repeated PriceLevel bids = 5;
  repeated PriceLevel asks = 6;
  int32 depth_limit = 7;
}

// One price level changed. qty == 0 means the level is now empty and should be removed.
message BookDelta {
  string venue = 1;
  string symbol = 2;
  uint64 feed_seq = 3;
  int64 ts_ns = 4;
  tp.common.v1.Side side = 5;
  int64 price_cents = 6;
  // The level's NEW total quantity, not a delta. Absolute values are idempotent
  // and survive a mis-sequenced replay; deltas do not.
  int64 qty = 7;
  int32 order_count = 8;
}

// A match happened. The anonymous public counterpart to an ExecutionReport.
message TradePrint {
  string venue = 1;
  string symbol = 2;
  uint64 feed_seq = 3;
  int64 ts_ns = 4;
  string trade_id = 5;
  int64 price_cents = 6;
  int64 qty = 7;
  // Which side removed liquidity. Public because it drives trade classification
  // and the simulator's momentum agents; the participants themselves are not.
  tp.common.v1.Side aggressor_side = 8;
}

// Published on a timer so a subscriber can distinguish "quiet market" from "dead feed",
// and can detect a gap even when no trading is happening.
message Heartbeat {
  string venue = 1;
  uint64 feed_seq = 2;
  int64 ts_ns = 3;
}

message FeedMessage {
  oneof payload {
    Snapshot snapshot = 1;
    BookDelta book_delta = 2;
    TradePrint trade_print = 3;
    Heartbeat heartbeat = 4;
  }
}

// Client -> md-publisher control messages.
message Subscribe {
  repeated string symbols = 1;
  int32 depth_limit = 2;
}

message Unsubscribe {
  repeated string symbols = 1;
}

// Sent after detecting a feed_seq gap. The publisher answers with a fresh Snapshot
// per symbol; it does not replay individual deltas.
message ResyncRequest {
  repeated string symbols = 1;
  uint64 last_good_feed_seq = 2;
}

message ClientMessage {
  oneof payload {
    Subscribe subscribe = 1;
    Unsubscribe unsubscribe = 2;
    ResyncRequest resync = 3;
  }
}
