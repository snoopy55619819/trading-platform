<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trading Platform</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved mode and style before the first paint, so a reload never flashes
      // the wrong colours. theme.ts owns these settings once the app has started.
      (function () {
        var saved = {};
        try {
          saved = JSON.parse(localStorage.getItem("broker.theme") || "{}");
        } catch (e) {}
        var style = ["pro", "active", "calm", "terminal"].indexOf(saved.style) >= 0 ? saved.style : "terminal"; // DEFAULT_STYLE in theme.ts
        var choice = ["light", "dark"].indexOf(saved.modeChoice) >= 0 ? saved.modeChoice : "system";
        var dark = style === "terminal" || choice === "dark" || (choice === "system" && matchMedia("(prefers-color-scheme: dark)").matches); // FIXED_MODES
        document.documentElement.dataset.mode = dark ? "dark" : "light";
        document.documentElement.dataset.style = style;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
