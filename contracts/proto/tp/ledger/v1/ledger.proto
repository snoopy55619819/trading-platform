syntax = "proto3";

package tp.ledger.v1;

import "tp/execution/v1/execution.proto";

// Double-entry books. Positions and balances here are DERIVED from journal lines -
// no service, including this one, stores a running total it increments.
//
// Every entry balances per asset: cash lines balance against cash lines, share lines
// against share lines. They never appear in the same balancing group.

enum AccountType {
  ACCOUNT_TYPE_UNSPECIFIED = 0;
  ACCOUNT_TYPE_CLIENT_CASH = 1;
  ACCOUNT_TYPE_CLIENT_SECURITIES_UNSETTLED = 2;
  ACCOUNT_TYPE_CLIENT_SECURITIES_SETTLED = 3;
  ACCOUNT_TYPE_FEES_REVENUE = 4;
  ACCOUNT_TYPE_HOUSE_CASH = 5;
  // The market-facing contra account. Becomes CLEARING_RECEIVABLE / CLEARING_PAYABLE
  // when the CCP arrives post-MVP.
  ACCOUNT_TYPE_STREET_CONTRA = 6;
}

message Position {
  string account_id = 1;
  string symbol = 2;
  // Tradeable immediately. In v1 the auto-settle job promotes unsettled to settled
  // at once; post-MVP the same job waits for T+1.
  int64 qty_settled = 3;
  int64 qty_unsettled = 4;
  // Exact accumulated cost. avg_cost_cents is derived from it, not the reverse.
  int64 total_cost_cents = 5;
  int64 avg_cost_cents = 6;
  string currency = 7;
}

message Balance {
  string account_id = 1;
  AccountType account_type = 2;
  // 'CASH' or a ticker. Cash amounts are in cents, share amounts in shares.
  string asset = 3;
  int64 amount = 4;
  string currency = 5;
}

message PostFillRequest {
  // fill_id is the idempotency key. Re-posting the same fill is a no-op that
  // returns the original entry_id rather than double-booking it.
  tp.execution.v1.Fill fill = 1;
}

message PostFillResponse {
  string entry_id = 1;
  bool already_posted = 2;
}

message CreditCashRequest {
  string account_id = 1;
  int64 amount_cents = 2;
  string currency = 3;
  string reference = 4;
  // Idempotency key.
  string request_id = 5;
}

message CreditCashResponse {
  string entry_id = 1;
  int64 new_balance_cents = 2;
  bool already_posted = 3;
}

message GetPositionsRequest {
  string account_id = 1;
  // Empty means all symbols with a non-zero position.
  repeated string symbols = 2;
}

message GetPositionsResponse {
  repeated Position positions = 1;
}

message GetBuyingPowerRequest {
  string account_id = 1;
  string currency = 2;
}

message GetBuyingPowerResponse {
  string account_id = 1;
  // Settled cash less cash committed to working buy orders.
  int64 buying_power_cents = 2;
  int64 cash_balance_cents = 3;
  int64 reserved_cents = 4;
  string currency = 5;
}

message GetBalancesRequest {
  string account_id = 1;
}

message GetBalancesResponse {
  repeated Balance balances = 1;
}

// Proves the books are internally consistent: SUM(debit) == SUM(credit) per entry
// per asset, and derived positions match an independent tally of posted fills.
message RunReconciliationRequest {
  string business_date = 1;
}

message RunReconciliationResponse {
  string run_id = 1;
  bool passed = 2;
  repeated string discrepancies = 3;
  int64 entries_checked = 4;
}

service LedgerService {
  rpc PostFill(PostFillRequest) returns (PostFillResponse);
  rpc CreditCash(CreditCashRequest) returns (CreditCashResponse);
  rpc GetPositions(GetPositionsRequest) returns (GetPositionsResponse);
  rpc GetBuyingPower(GetBuyingPowerRequest) returns (GetBuyingPowerResponse);
  rpc GetBalances(GetBalancesRequest) returns (GetBalancesResponse);
  rpc RunReconciliation(RunReconciliationRequest) returns (RunReconciliationResponse);
}
