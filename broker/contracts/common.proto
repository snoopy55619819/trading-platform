syntax = "proto3";

package broker.v1;

// Shared vocabulary. Enum numbers are pinned forever (see contracts/DECISIONS.md §4):
// never renumber, never reuse a retired number. Zero is always UNSPECIFIED and is always
// invalid as input - a service rejects it rather than defaulting it.

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
}

enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  TIME_IN_FORCE_DAY = 1;
  TIME_IN_FORCE_GTC = 2;
  // Immediate-or-cancel: fill what you can right now, cancel the rest.
  TIME_IN_FORCE_IOC = 3;
  // Fill-or-kill: fill the entire quantity immediately or nothing at all.
  TIME_IN_FORCE_FOK = 4;
}

// Order lifecycle. Terminal states are FILLED, CANCELED, REJECTED and EXPIRED;
// no transition leaves them.
enum OrdStatus {
  ORD_STATUS_UNSPECIFIED = 0;
  ORD_STATUS_PENDING_NEW = 1;
  ORD_STATUS_NEW = 2;
  ORD_STATUS_PARTIALLY_FILLED = 3;
  ORD_STATUS_FILLED = 4;
  ORD_STATUS_PENDING_CANCEL = 5;
  ORD_STATUS_CANCELED = 6;
  ORD_STATUS_REJECTED = 7;
  ORD_STATUS_EXPIRED = 8;
}

// Why an execution report was emitted. Mirrors FIX ExecType(150).
enum ExecType {
  EXEC_TYPE_UNSPECIFIED = 0;
  EXEC_TYPE_NEW = 1;
  EXEC_TYPE_TRADE = 2;
  EXEC_TYPE_CANCELED = 3;
  EXEC_TYPE_REJECTED = 4;
  EXEC_TYPE_EXPIRED = 5;
}

// Every rejection must name a reason. "Rejected" with no reason is a bug -
// the OMS milestone's done-test is that bad orders are rejected for the RIGHT reason.
enum RejectReason {
  REJECT_REASON_UNSPECIFIED = 0;
  REJECT_REASON_UNKNOWN_SYMBOL = 1;
  REJECT_REASON_SYMBOL_HALTED = 2;
  REJECT_REASON_INVALID_TICK_SIZE = 3;
  REJECT_REASON_INVALID_LOT_SIZE = 4;
  REJECT_REASON_PRICE_OUT_OF_BAND = 5;
  REJECT_REASON_INSUFFICIENT_BUYING_POWER = 6;
  REJECT_REASON_POSITION_LIMIT_EXCEEDED = 7;
  REJECT_REASON_DUPLICATE_CLIENT_ORDER_ID = 8;
  REJECT_REASON_RATE_LIMIT_EXCEEDED = 9;
  REJECT_REASON_UNKNOWN_ACCOUNT = 10;
  REJECT_REASON_UNKNOWN_ORDER = 11;
  REJECT_REASON_TOO_LATE_TO_CANCEL = 12;
  REJECT_REASON_MALFORMED_REQUEST = 13;
  REJECT_REASON_VENUE_UNAVAILABLE = 14;
}
