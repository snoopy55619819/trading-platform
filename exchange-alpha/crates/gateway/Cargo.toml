[package]
name = "gateway"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A library plus a thin binary, so the integration tests can run a real gateway in-process.
[lib]
path = "src/lib.rs"

[[bin]]
name = "gateway"
path = "src/main.rs"

[dependencies]
fix-core.workspace = true
matching-engine.workspace = true
md-publisher.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
# migrate! only reads the SQL files at compile time; no database is needed to build.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
proptest = "1"
prost = "0.14"
tokio-tungstenite = "0.30"
