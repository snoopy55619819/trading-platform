[package]
name = "matching-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Only for the journal's on-disk format. The matching path itself never serialises.
serde.workspace = true
serde_json.workspace = true

# Only benches/latency.rs is a benchmark; without these, `cargo bench` also runs the library's
# and CLI's unit tests and reports them as "ignored".
[lib]
bench = false

[[bin]]
name = "matching-engine"
path = "src/main.rs"
bench = false

[dev-dependencies]
proptest = "1"

[[bench]]
name = "latency"
harness = false
