<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The tab icon: three candles, one down then two rising, on a dark tile so it reads on
       light and dark browser tabs alike. Kept to a few thick shapes to stay clear at 16px. -->
  <rect width="32" height="32" rx="7" fill="#151a21"/>
  <g stroke-width="2" stroke-linecap="round">
    <line x1="8" y1="12" x2="8" y2="25" stroke="#f2635b"/>
    <rect x="5" y="14" width="6" height="8" rx="1.5" fill="#f2635b"/>
    <line x1="16" y1="10" x2="16" y2="22" stroke="#2fbf7c"/>
    <rect x="13" y="12" width="6" height="8" rx="1.5" fill="#2fbf7c"/>
    <line x1="24" y1="5" x2="24" y2="18" stroke="#2fbf7c"/>
    <rect x="21" y="7" width="6" height="9" rx="1.5" fill="#2fbf7c"/>
  </g>
</svg>
